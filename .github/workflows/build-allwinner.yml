name: build-allwinner

permissions: write-all
#开启写权限，防止无法上传到release

on:
  workflow_dispatch:
  
env:
  FREE_DISK_SH: scripts/free_disk_space.sh
  ENV_SH: scripts/environment.sh
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  PLATFORM_FILE: configs/allwinner.txt
  CONFIG_FILE: configs/packages-L.txt
  SETTINGS_SH: scripts/init-settings.sh
  PACKAGES_SH: scripts/packages.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: false
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 330

    steps:
    - name: 检查
      uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a  # v7.0.1

    - name: 初始化环境
      timeout-minutes: 40
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        # 每条外部命令都加超时：宿主 runner 升级/apt 锁/网络 stall 都可能让
        # 初始化阶段无限挂起，最终表现为 "runner lost communication"（run 42138849825）。
        sudo -E timeout 480 bash "$FREE_DISK_SH"
        # 只刷新索引，不做 full-upgrade：整机升级可能替换 systemd/openssh 等
        # runner agent 自身依赖的组件，风险高且对构建无必要。
        sudo -E apt-get -qq -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=60 update -y
        sudo -E timeout 1500 bash "$ENV_SH"
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo timeout 30 timedatectl set-timezone "$TZ" || true
        timeout 120 docker image prune -a -f || true
        timeout 60 docker container prune -f || true
        sudo mkdir -p /workdir
        sudo chown "$USER":"$GROUPS" /workdir

    - name: 检查空间使用情况1
      if: (!cancelled())
      run: df -hT

    - name: 克隆源码
      working-directory: /workdir
      run: |
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt
        cd openwrt

    - name: 开启缓存
      uses: klever1988/cachewrtbuild@b729f807837dbc3455d02fd35192660d9b662121
      with:
        ccache: 'true'
        mixkey: 'cortexa53'
        prefix: ${{ github.workspace }}/openwrt

    - name: 安装 feeds
      run: |
        cd openwrt
        # kenzok8/small-package + linkease/istore（须在 update 前写入 feeds）
        chmod +x $GITHUB_WORKSPACE/scripts/feeds-extra.sh $GITHUB_WORKSPACE/scripts/packages.sh
        $GITHUB_WORKSPACE/scripts/feeds-extra.sh
        ./scripts/feeds update -a
        # 冲突清理后再 install
        $GITHUB_WORKSPACE/scripts/packages.sh
        ./scripts/feeds install -a

    - name: 导入补丁和配置 & 执行脚本
      run: |
        [ -d files ] && mv files openwrt/files || echo "files not found"
        [ -f $PLATFORM_FILE ] && cat $PLATFORM_FILE >> openwrt/.config
        [ -f $CONFIG_FILE ] && cat $CONFIG_FILE >> openwrt/.config
        cd openwrt
        chmod +x $GITHUB_WORKSPACE/$SETTINGS_SH && $GITHUB_WORKSPACE/$SETTINGS_SH

    - name: 下载文件
      run: |
        cd openwrt
        make defconfig
        make download -j8 V=10
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: 编译固件
      id: compile
      run: |
        cd openwrt
        make defconfig
        echo -e "$(($(nproc)+1)) thread compile"
        make -j$(($(nproc)+1)) || make -j$(nproc) || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 空间使用情况2
      if: (!cancelled())
      run: df -hT

    - name: 上传 bin 目录
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin

    - name: 整理文件
      id: organize
      if: steps.compile.outputs.status == 'success'
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf *.buildinfo 
        rm -rf *.json 
        rm -rf *.manifest 
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 固件重命名
      if: steps.organize.outputs.status == 'success'
      shell: bash
      run: |
        cd openwrt/bin/targets/*/*
        for file in *sunxi-cortexa53-*.gz; do
          new_name=$(echo "$file" | sed 's/sunxi-cortexa53-//')
          mv -v "$file" "$new_name"
        done

    - name: 上传固件目录
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      if: env.UPLOAD_FIRMWARE == 'true' && steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: 生成发布标签
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        echo -e "🎉 allwinner平台\n✅ 主线源码\n❗️ ip地址 : 192.168.8.1" >> release.txt
        echo "release_tag=$(date +"%Y.%m.%d_Allwinner")" >> $GITHUB_OUTPUT
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 上传固件到发布
      uses: softprops/action-gh-release@v3.0.2
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*

    - name: 删除以前发布的固件
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # 原用 dev-drprasad/delete-older-releases, 但其上游已停更,
      # 最新 v0.3.4 仍是 Node 20 runtime, 触发 GitHub 弃用警告。
      # 改用 gh CLI 实现 keep_latest:15 + delete_tags 等效逻辑。
      run: |
        # 按 createdAt 升序列出所有 release 的 tag, 跳过最新 15 个, 删除其余(含 tag)
        gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
          --json tagName,createdAt -q 'sort_by(.createdAt) | .[].tagName' \
          | head -n -15 \
          | while read -r tag; do
              [ -n "$tag" ] || continue
              echo "删除 release 及 tag: $tag"
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" \
                --cleanup-tag --yes || true
            done

    - name: 删除以前的工作流程
      uses: Mattraks/delete-workflow-runs@v2
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        repository: ${{ github.repository }}
        retain_days: 1
        keep_minimum_runs: 3
