name: build-x86

permissions: write-all
#开启写权限，防止无法上传到release

on:
  repository_dispatch:
  workflow_dispatch:
  schedule:
   - cron: 0 20 * * 4
   #     分,时,日,月,周。每周五 20时执行一次 (UTC时间)
  
env:
  FREE_DISK_SH: scripts/free_disk_space.sh
  ENV_SH: scripts/environment.sh
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  CONFIG_FILE: configs/packages-x86.txt
  SETTINGS_SH: scripts/init-settings.sh
  PACKAGES_SH: scripts/packages.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: false
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    # 用 ubuntu-24.04: 22.04 runner 镜像的 findutils/coreutils 需 glibc 2.38 但 libc6 仍是 2.35,
    # 导致 find/sed/xargs 报 GLIBC_2.38 not found. 24.04 的 glibc 2.39 无此问题.
    # binutils 2.42 在 24.04 的 FORTIFY 兼容问题(__snprintf_chk undefined)
    # 通过 packages-x86.txt 的 CONFIG_BINUTILS_USE_VERSION_2_43 固定到 2.43.1 解决。
    runs-on: ubuntu-24.04

    steps:
    - name: 检查
      uses: actions/checkout@main

    - name: 初始化环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        chmod +x $FREE_DISK_SH && $FREE_DISK_SH
        sudo -E apt-get -qq update -y
        sudo -E apt-get -qq full-upgrade -y
        chmod +x $ENV_SH && $ENV_SH
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo timedatectl set-timezone "$TZ"
        docker image prune -a -f
        docker container prune -f
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: 检查空间使用情况1
      if: (!cancelled())
      run: df -hT

    - name: 克隆源码
      working-directory: /workdir
      run: |
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: 开启缓存
      uses: klever1988/cachewrtbuild@main
      with:
        ccache: 'true'
        mixkey: 'x86-smpackage-istore-binutils243-kconfig43'  # Kconfig 符号变更，丢弃旧缓存
        prefix: ${{ github.workspace }}/openwrt
        # skip:false = 只 restore 缓存, 不 sed 改写 Makefile 跳过 toolchain 构建。
        # 原因: skip:true 时 cachewrtbuild 删除 $(tool*/stamp-compile) 依赖, 与本 workflow
        # 显式 `make tools/compile` + `make toolchain/compile` 冲突 —— stamp 依赖错乱导致
        # toolchain/binutils 在缓存命中后被错误重编, 链接 as-new 时 __fprintf_chk undefined
        # (run 31296832116)。skip:false 让 stamp 机制自行增量跳过已编译部分, 行为可预测。
        skip: 'false'

    - name: 安装 feeds
      run: |
        cd openwrt
        # kenzok8/small-package + linkease/istore（须在 update 前写入 feeds）
        chmod +x $GITHUB_WORKSPACE/scripts/feeds-extra.sh $GITHUB_WORKSPACE/scripts/packages.sh
        $GITHUB_WORKSPACE/scripts/feeds-extra.sh
        ./scripts/feeds update -a
        # 冲突清理后再 install
        $GITHUB_WORKSPACE/scripts/packages.sh
        ./scripts/feeds install -a

    - name: 导入补丁和配置 & 执行脚本
      run: |
        [ -d files ] && mv files openwrt/files || echo "files not found"
        [ -f $CONFIG_FILE ] && cat $CONFIG_FILE >> openwrt/.config
        cd openwrt
        chmod +x $GITHUB_WORKSPACE/$SETTINGS_SH && $GITHUB_WORKSPACE/$SETTINGS_SH

    # - name: 下载文件
    #   run: |
    #     cd openwrt
    #     make defconfig
    #     make download -j8 V=10
    #     find dl -size -1024c -exec ls -l {} \;
    #     find dl -size -1024c -exec rm -f {} \;

    - name: 空间使用情况2
      if: (!cancelled())
      run: df -hT

    - name: 编译工具链
      id: mtools
      run: |
        cd openwrt
        # lede 的 rules.mk 用 := 硬编码 HOST_CFLAGS:=-O2 $(HOST_CPPFLAGS), GNU make 不允许
        # env var 覆盖文件内 := 赋值, 所以 env:HOST_CFLAGS 被静默丢弃 (run 31347689424 链接
        # 命令里无 -U_FORTIFY_SOURCE)。直接 sed 注入, configure 阶段 CFLAGS 一定带上,
        # 写进 config.status 后 make all 沿用。lede 不像 OpenWrt master 有 HOST_EXTRA_CFLAGS。
        # ubuntu-24.04 gcc 14 + glibc 2.39 的 host binutils 链接缺符号, 用 -U_FORTIFY_SOURCE
        # + -U_FILE_OFFSET_BITS 一次性消掉 fortify(__fprintf_chk 等)、LFS(fopen64 等) 和
        # C23 strto*(__isoc23_strtoul) 三类符号 (run 31351607961 验证 binutils 全过)。
        sed -i 's/^HOST_CFLAGS:=-O2/HOST_CFLAGS:=-O2 -U_FORTIFY_SOURCE -U_FILE_OFFSET_BITS/' rules.mk
        grep -n '^HOST_CFLAGS:=' rules.mk || { echo "ERROR: rules.mk HOST_CFLAGS 注入失败" >&2; exit 1; }
        # fakeroot 1.36 的 time64 变体硬编码 -D_FILE_OFFSET_BITS=64 -D_TIME_BITS=64 在 _CPPFLAGS,
        # 命令行里 _CPPFLAGS 在前 CFLAGS 在后, 全局 -U_FILE_OFFSET_BITS 会覆盖它, 触发
        # features-time64.h "#error _TIME_BITS=64 is allowed only with _FILE_OFFSET_BITS=64"
        # (run 31351607961)。重定义 Host/Prepare 在解压后 sed 删掉这两个 -D: time64 变体全部
        # 实质内容在 #ifdef TIME64_HACK 内, x86-64 不定义 TIME64_HACK, 删 -D 零功能损失。
        # 用临时片段文件 + sed r 命令插入, 避免嵌套 sed 的转义地狱。
        cat > /tmp/fakeroot-prepare.mk <<'PREP'
define Host/Prepare
	$(call Host/Prepare/Default)
	sed -i 's/^libfakeroot_time64_la_CPPFLAGS = -D_FILE_OFFSET_BITS=64 -D_TIME_BITS=64/libfakeroot_time64_la_CPPFLAGS =/' $(HOST_BUILD_DIR)/Makefile.am $(HOST_BUILD_DIR)/Makefile.in
endef
PREP
        sed -i '/^include $(INCLUDE_DIR)\/host-build.mk$/r /tmp/fakeroot-prepare.mk' tools/fakeroot/Makefile
        grep -A4 'define Host/Prepare' tools/fakeroot/Makefile || { echo "ERROR: fakeroot Host/Prepare 注入失败" >&2; exit 1; }
        # 强制冷编译 binutils: cachewrtbuild 热缓存 restore 后, stamp 机制会判断 as-new 需重链
        # 却不重编全部 .o, 新旧 .o 混链导致 undefined (run 31323441659)。删 build_dir 产物强制全量。
        rm -rf build_dir/toolchain-*/binutils-2.43.1
        make defconfig
        resolved_binutils="$(sed -n 's/^CONFIG_BINUTILS_VERSION="\([^\"]*\)"/\1/p' .config || true)"
        echo "Resolved binutils version: ${resolved_binutils:-<unset>}"
        if [ "${resolved_binutils}" != "2.43.1" ]; then
          echo "ERROR: expected binutils 2.43.1, got ${resolved_binutils:-<unset>}" >&2
          grep -E '^CONFIG_BINUTILS(_USE_VERSION|_VERSION)_' .config || true
          exit 1
        fi
        echo -e "$(($(nproc)+1)) thread compile"
        make tools/compile -j$(($(nproc)+1)) || make tools/compile -j1 V=s
        make toolchain/compile -j$(($(nproc)+1)) || make toolchain/compile -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT
        # 取 toolchain + kernel 源码 commit 作为 kernel 缓存 key 指纹。
        # toolchainHash 与 cachewrtbuild 同源(git log tools toolchain),
        # 避免 toolchain 升级后命中旧 kernel 缓存导致 ABI 不匹配;
        # kernelHash 跟踪 target/linux 源码变更。
        # || true 容错: 取不到 hash 时让 key 含空值(缓存不命中), 不阻断编译。
        echo "toolchain_hash=$(git log --pretty=tformat:'%h' -n1 tools toolchain 2>/dev/null || echo none)" >> $GITHUB_OUTPUT
        echo "kernel_hash=$(git log --pretty=tformat:'%h' -n1 target/linux 2>/dev/null || echo none)" >> $GITHUB_OUTPUT

    - name: 空间使用情况3_1
      if: (!cancelled())
      run: df -hT

    - name: 清除工具链编译中间产物...
      if: steps.mtools.outputs.status == 'success' && !cancelled()
      run: |
        cd openwrt
        rm -rf dl/*
        rm -rf build_dir/toolchain-*

    - name: 空间使用情况3_2
      if: (!cancelled())
      run: df -hT

    - name: 恢复内核编译缓存
      id: kernel_cache
      if: steps.mtools.outputs.status == 'success' && !cancelled()
      uses: actions/cache@v4
      with:
        # 只缓存 kernel 源码树+编译产物, 不碰 package 产物(它们在同级的 openssl-* 等并列目录)。
        # staging_dir/target-*/usr 是 kernel+package 共享 staging, 不缓存以免冲突。
        path: |
          openwrt/build_dir/target-*/linux-*
        # key = toolchain指纹 + kernel源码指纹; 二者任一变更则失效, restore-keys 兜底拿旧产物垫底。
        key: kernel-x86-${{ steps.mtools.outputs.toolchain_hash }}-${{ steps.mtools.outputs.kernel_hash }}
        restore-keys: |
          kernel-x86-

    - name: 编译内核
      id: mkernel
      if: steps.mtools.outputs.status == 'success' && !cancelled()
      run: |
        cd openwrt
        if [ "${{ steps.kernel_cache.outputs.cache-hit }}" = "true" ]; then
          echo "✅ kernel 缓存命中, 增量编译将跳过已编译部分"
        else
          echo "⚠️ kernel 缓存未命中, 全量编译内核"
        fi
        echo -e "$(($(nproc)+1)) thread compile"
        make target/linux/compile -j$(($(nproc)+1)) || make target/linux/compile -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 空间使用情况4
      if: (!cancelled())
      run: df -hT

    - name: 编译插件
      id: mpackage
      if: steps.mkernel.outputs.status == 'success' && !cancelled()
      run: |
        cd openwrt
        rm -rf dl/*
        echo -e "$(($(nproc)+1)) thread compile"
        make package/compile -j$(($(nproc)+1)) || make package/compile -j1 V=s
        make package/index
        make package/install -j$(nproc) || make package/install -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 空间使用情况5
      if: (!cancelled())
      run: df -hT

    - name: 清除插件编译文件
      id: cpackage
      if: steps.mpackage.outputs.status == 'success' && !cancelled()
      run: |
        cd openwrt
        rm -rf build_dir/target-*/host
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 空间使用情况6
      if: (!cancelled())
      run: df -hT

    - name: 编译固件
      id: compile
      if: steps.cpackage.outputs.status == 'success' && !cancelled()
      run: |
        cd openwrt
        echo -e "$(($(nproc)+1)) thread compile"
        make target/install -j$(nproc) || make target/install -j1 V=s
        make json_overview_image_info
        make checksum
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 空间使用情况7
      if: (!cancelled())
      run: df -hT

    - name: 上传 bin 目录
      uses: actions/upload-artifact@main
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin

    - name: 整理文件
      id: organize
      if: steps.compile.outputs.status == 'success'
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf *.bin
        rm -rf *.buildinfo 
        rm -rf *.json 
        rm -rf *.manifest 
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 上传固件目录
      uses: actions/upload-artifact@main
      if: env.UPLOAD_FIRMWARE == 'true' && steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: 生成发布标签
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        echo -e "🎉 X86-64平台\n✅ 主线源码\n❗️ ip地址 : 192.168.8.1" >> release.txt
        echo "release_tag=$(date +"%Y.%m.%d_X86-64")" >> $GITHUB_OUTPUT
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 上传固件到发布
      uses: softprops/action-gh-release@v3.0.2
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*

    - name: 删除以前发布的固件
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # 原用 dev-drprasad/delete-older-releases, 但其上游已停更,
      # 最新 v0.3.4 仍是 Node 20 runtime, 触发 GitHub 弃用警告。
      # 改用 gh CLI 实现 keep_latest:15 + delete_tags 等效逻辑。
      run: |
        # 按 createdAt 升序列出所有 release 的 tag, 跳过最新 15 个, 删除其余(含 tag)
        gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
          --json tagName,createdAt -q 'sort_by(.createdAt) | .[].tagName' \
          | head -n -15 \
          | while read -r tag; do
              [ -n "$tag" ] || continue
              echo "删除 release 及 tag: $tag"
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" \
                --cleanup-tag --yes || true
            done

    - name: 删除以前的工作流程
      uses: Mattraks/delete-workflow-runs@v2
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        repository: ${{ github.repository }}
        retain_days: 1
        keep_minimum_runs: 3
