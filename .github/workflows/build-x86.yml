name: build-x86

permissions: write-all
#开启写权限，防止无法上传到release

on:
  repository_dispatch:
  workflow_dispatch:
  schedule:
   - cron: 0 20 * * 4
   #     分,时,日,月,周。每周五 20时执行一次 (UTC时间)
  
env:
  FREE_DISK_SH: scripts/free_disk_space.sh
  ENV_SH: scripts/environment.sh
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  CONFIG_FILE: configs/packages-x86.txt
  CONFIG_5G: configs/packages-5G.txt
  SETTINGS_SH: scripts/init-settings.sh
  PACKAGES_SH: scripts/packages.sh
  INSTALL5G_SH: scripts/install-5G.sh
  CLASH_CORE_SH: scripts/preset-clash-core-amd64.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: false
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    # 用 ubuntu-24.04: 22.04 runner 镜像的 findutils/coreutils 需 glibc 2.38 但 libc6 仍是 2.35,
    # 导致 find/sed/xargs 报 GLIBC_2.38 not found. 24.04 的 glibc 2.39 无此问题.
    # binutils 2.42 在 24.04 的 FORTIFY 兼容问题(__snprintf_chk undefined)通过
    # 编译工具链步骤设置 HOST_CFLAGS=-U_FORTIFY_SOURCE 解决, 不切版本(避免破坏缓存)
    runs-on: ubuntu-24.04

    steps:
    - name: 检查
      uses: actions/checkout@main

    - name: 初始化环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        chmod +x $FREE_DISK_SH && $FREE_DISK_SH
        sudo -E apt-get -qq update -y
        sudo -E apt-get -qq full-upgrade -y
        chmod +x $ENV_SH && $ENV_SH
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo timedatectl set-timezone "$TZ"
        docker image prune -a -f
        docker container prune -f
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: 安装 Node.js 20
      # smartdns-ui 的 webui 用 Next.js 16 + React 19 + ESLint 9, 需 node>=20
      # 用 actions/setup-node 而非 NodeSource 脚本: 后者会装新版 coreutils/findutils,
      # 破坏 ubuntu-22.04 的 glibc 兼容 (find/sed/xargs 报 GLIBC_2.38 not found)
      uses: actions/setup-node@v7
      with:
        node-version: '20'

    - name: 检查空间使用情况1
      if: (!cancelled())
      run: df -hT

    - name: 克隆源码
      working-directory: /workdir
      run: |
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: 开启缓存
      uses: klever1988/cachewrtbuild@main
      with:
        ccache: 'true'
        mixkey: 'x86-fortify-fix'  # 改 mixkey 使旧缓存失效, 强制重编 binutils(应用 HOST_CFLAGS 修复)
        prefix: ${{ github.workspace }}/openwrt

    - name: 安装 feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: 导入补丁和配置 & 执行脚本
      run: |
        [ -d files ] && mv files openwrt/files || echo "files not found"
        [ -f $CONFIG_5G ] && cat $CONFIG_5G >> openwrt/.config
        [ -f $CONFIG_FILE ] && cat $CONFIG_FILE >> openwrt/.config
        cd openwrt
        chmod +x $GITHUB_WORKSPACE/$INSTALL5G_SH && $GITHUB_WORKSPACE/$INSTALL5G_SH
        chmod +x $GITHUB_WORKSPACE/$SETTINGS_SH && $GITHUB_WORKSPACE/$SETTINGS_SH
        chmod +x $GITHUB_WORKSPACE/$PACKAGES_SH && $GITHUB_WORKSPACE/$PACKAGES_SH
        chmod +x $GITHUB_WORKSPACE/$CLASH_CORE_SH && $GITHUB_WORKSPACE/$CLASH_CORE_SH

    # - name: 下载文件
    #   run: |
    #     cd openwrt
    #     make defconfig
    #     make download -j8 V=10
    #     find dl -size -1024c -exec ls -l {} \;
    #     find dl -size -1024c -exec rm -f {} \;

    - name: 空间使用情况2
      if: (!cancelled())
      run: df -hT

    - name: 编译工具链
      id: mtools
      env:
        # 禁用 host build 的 FORTIFY_SOURCE, 修复 ubuntu-24.04 上 binutils 2.42 链接报
        # __snprintf_chk/__sprintf_chk undefined (libiberty 的 .o 含 _FORTIFY 调用, 链接 as/ld 时缺符号)
        # 不切 binutils 版本(避免破坏 cachewrtbuild 缓存), 不改 lede 源码, 仅环境变量
        HOST_CFLAGS: -O2 -U_FORTIFY_SOURCE
      run: |
        cd openwrt
        make defconfig
        echo -e "$(($(nproc)+1)) thread compile"
        make tools/compile -j$(($(nproc)+1)) || make tools/compile -j1 V=s
        make toolchain/compile -j$(($(nproc)+1)) || make toolchain/compile -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 空间使用情况3_1
      if: (!cancelled())
      run: df -hT

    - name: 清除工具链编译中间产物...
      if: steps.mtools.outputs.status == 'success' && !cancelled()
      run: |
        cd openwrt
        rm -rf dl/*
        rm -rf build_dir/toolchain-*

    - name: 空间使用情况3_2
      if: (!cancelled())
      run: df -hT

    - name: 编译内核
      id: mkernel
      if: steps.mtools.outputs.status == 'success' && !cancelled()
      run: |
        cd openwrt
        echo -e "$(($(nproc)+1)) thread compile"
        make target/linux/compile -j$(($(nproc)+1)) || make target/linux/compile -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 空间使用情况4
      if: (!cancelled())
      run: df -hT

    - name: 编译插件
      id: mpackage
      if: steps.mkernel.outputs.status == 'success' && !cancelled()
      run: |
        cd openwrt
        rm -rf dl/*
        echo -e "$(($(nproc)+1)) thread compile"
        # 让 setup-node 装的 node 20 优先于 lede staging 的 v16, 避免 smartdns-webui (Next 16) 的 npm run build 失败
        NODE20_BIN=$(dirname $(which node))
        export PATH="$NODE20_BIN:$PATH"
        echo "using node: $(node -v) at $NODE20_BIN"
        make package/compile -j$(($(nproc)+1)) || make package/compile -j1 V=s
        make package/index
        make package/install -j$(nproc) || make package/install -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 空间使用情况5
      if: (!cancelled())
      run: df -hT

    - name: 清除插件编译文件
      id: cpackage
      if: steps.mpackage.outputs.status == 'success' && !cancelled()
      run: |
        cd openwrt
        rm -rf build_dir/target-*/host
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 空间使用情况6
      if: (!cancelled())
      run: df -hT

    - name: 编译固件
      id: compile
      if: steps.cpackage.outputs.status == 'success' && !cancelled()
      run: |
        cd openwrt
        echo -e "$(($(nproc)+1)) thread compile"
        make target/install -j$(nproc) || make target/install -j1 V=s
        make json_overview_image_info
        make checksum
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 空间使用情况7
      if: (!cancelled())
      run: df -hT

    - name: 上传 bin 目录
      uses: actions/upload-artifact@main
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin

    - name: 整理文件
      id: organize
      if: steps.compile.outputs.status == 'success'
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf *.bin
        rm -rf *.buildinfo 
        rm -rf *.json 
        rm -rf *.manifest 
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 上传固件目录
      uses: actions/upload-artifact@main
      if: env.UPLOAD_FIRMWARE == 'true' && steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: 生成发布标签
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        echo -e "🎉 X86-64平台\n✅ 主线源码\n❗️ ip地址 : 192.168.8.1" >> release.txt
        echo "release_tag=$(date +"%Y.%m.%d_X86-64")" >> $GITHUB_OUTPUT
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 上传固件到发布
      uses: softprops/action-gh-release@v3.0.2
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*

    - name: 删除以前发布的固件
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # 原用 dev-drprasad/delete-older-releases, 但其上游已停更,
      # 最新 v0.3.4 仍是 Node 20 runtime, 触发 GitHub 弃用警告。
      # 改用 gh CLI 实现 keep_latest:15 + delete_tags 等效逻辑。
      run: |
        # 按 createdAt 升序列出所有 release 的 tag, 跳过最新 15 个, 删除其余(含 tag)
        gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
          --json tagName,createdAt -q 'sort_by(.createdAt) | .[].tagName' \
          | head -n -15 \
          | while read -r tag; do
              [ -n "$tag" ] || continue
              echo "删除 release 及 tag: $tag"
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" \
                --cleanup-tag --yes || true
            done

    - name: 删除以前的工作流程
      uses: Mattraks/delete-workflow-runs@v2
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        repository: ${{ github.repository }}
        retain_days: 1
        keep_minimum_runs: 3
