name: build-rockchip

permissions: write-all
#开启写权限，防止无法上传到release

on:
  workflow_dispatch:
  
env:
  FREE_DISK_SH: scripts/free_disk_space.sh
  ENV_SH: scripts/environment.sh
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  PLATFORM_FILE: configs/rockchip-L.txt
  CONFIG_FILE: configs/packages.txt
  SETTINGS_SH: scripts/init-settings.sh
  PACKAGES_SH: scripts/packages.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: false
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: 检查
      uses: actions/checkout@main

    - name: 初始化环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        chmod +x $FREE_DISK_SH && $FREE_DISK_SH
        sudo -E apt-get -qq update -y
        sudo -E apt-get -qq full-upgrade -y
        chmod +x $ENV_SH && $ENV_SH
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo timedatectl set-timezone "$TZ"
        docker image prune -a -f
        docker container prune -f
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: 检查空间使用情况1
      if: (!cancelled())
      run: df -hT

    - name: 克隆源码
      working-directory: /workdir
      run: |
        git clone $REPO_URL --depth 1 -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: 开启缓存
      id: cachewrtbuild
      uses: klever1988/cachewrtbuild@main
      with:
        ccache: 'true'
        mixkey: 'armv8'
        prefix: ${{ github.workspace }}/openwrt

    - name: 安装 feeds
      run: |
        cd openwrt
        # kenzok8/small-package + linkease/istore（须在 update 前写入 feeds）
        chmod +x $GITHUB_WORKSPACE/scripts/feeds-extra.sh $GITHUB_WORKSPACE/scripts/packages.sh
        $GITHUB_WORKSPACE/scripts/feeds-extra.sh
        ./scripts/feeds update -a
        # 冲突清理后再 install
        $GITHUB_WORKSPACE/scripts/packages.sh
        ./scripts/feeds install -a

    - name: 导入补丁和配置 & 执行脚本
      run: |
        [ -d files ] && mv files openwrt/files || echo "files not found"
        [ -f $PLATFORM_FILE ] && cat $PLATFORM_FILE >> openwrt/.config
        [ -f $CONFIG_FILE ] && cat $CONFIG_FILE >> openwrt/.config
        cd openwrt
        rm target/linux/rockchip/patches-*/991-arm64-dts-rockchip-add-more-cpu-operating-points-for.patch || true
        chmod +x $GITHUB_WORKSPACE/$SETTINGS_SH && $GITHUB_WORKSPACE/$SETTINGS_SH

    # - name: 下载文件
    #   run: |
    #     cd openwrt
    #     make defconfig
    #     make download -j8 V=10
    #     find dl -size -1024c -exec ls -l {} \;
    #     find dl -size -1024c -exec rm -f {} \;

    - name: 空间使用情况2
      if: (!cancelled())
      run: df -hT

    - name: 编译工具链
      id: mtools
      run: |
        cd openwrt
        make defconfig
        echo -e "$(($(nproc)+1)) thread compile"
        if [ "${{ steps.cachewrtbuild.outputs.hit }}" = "1" ]; then
          echo "✅ cachewrtbuild 缓存命中, staging_dir 已就绪, 跳过 toolchain 编译"
        else
          echo "⚠️ 缓存未命中, 全量编译 toolchain"
          make tools/compile -j$(($(nproc)+1)) || make tools/compile -j1 V=s
          make toolchain/compile -j$(($(nproc)+1)) || make toolchain/compile -j1 V=s
        fi
        echo "status=success" >> $GITHUB_OUTPUT
        echo "toolchain_hash=$(git log --pretty=tformat:'%h' -n1 tools toolchain 2>/dev/null || echo none)" >> $GITHUB_OUTPUT
        echo "kernel_hash=$(git log --pretty=tformat:'%h' -n1 target/linux 2>/dev/null || echo none)" >> $GITHUB_OUTPUT

    - name: 空间使用情况3_1
      if: (!cancelled())
      run: df -hT

    - name: 清除工具链编译中间产物...
      if: steps.mtools.outputs.status == 'success' && !cancelled()
      run: |
        cd openwrt
        rm -rf dl/*
        rm -rf build_dir/toolchain-*

    - name: 空间使用情况3_2
      if: (!cancelled())
      run: df -hT

    - name: 恢复内核编译缓存
      id: kernel_cache
      if: steps.mtools.outputs.status == 'success' && !cancelled()
      uses: actions/cache@v5
      with:
        path: |
          openwrt/build_dir/target-*/linux-*
        key: kernel-rockchip-${{ steps.mtools.outputs.toolchain_hash }}-${{ steps.mtools.outputs.kernel_hash }}
        restore-keys: |
          kernel-rockchip-

    - name: 编译内核
      id: mkernel
      if: steps.mtools.outputs.status == 'success' && !cancelled()
      run: |
        cd openwrt
        if [ "${{ steps.kernel_cache.outputs.cache-hit }}" = "true" ]; then
          echo "✅ kernel 缓存命中, 增量编译将跳过已编译部分"
        else
          echo "⚠️ kernel 缓存未命中, 全量编译内核"
        fi
        echo -e "$(($(nproc)+1)) thread compile"
        make target/linux/compile -j$(($(nproc)+1)) || make target/linux/compile -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 空间使用情况4
      if: (!cancelled())
      run: df -hT

    - name: 恢复插件编译缓存
      id: package_cache
      if: steps.mkernel.outputs.status == 'success' && !cancelled()
      uses: actions/cache@v5
      with:
        path: |
          openwrt/build_dir/target-*/packages/
        key: pkg-rockchip-${{ steps.mtools.outputs.toolchain_hash }}-${{ hashFiles('configs/packages.txt', 'configs/rockchip-L.txt', 'scripts/packages.sh', 'scripts/feeds-extra.sh') }}
        restore-keys: |
          pkg-rockchip-

    - name: 编译插件
      id: mpackage
      if: steps.mkernel.outputs.status == 'success' && !cancelled()
      run: |
        cd openwrt
        echo -e "$(($(nproc)+1)) thread compile"
        make package/compile -j$(($(nproc)+1)) || make package/compile -j1 V=s
        make package/index
        make package/install -j$(nproc) || make package/install -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 空间使用情况5
      if: (!cancelled())
      run: df -hT

    - name: 清除插件编译文件 & 精简缓存
      id: cpackage
      if: steps.mpackage.outputs.status == 'success' && !cancelled()
      run: |
        cd openwrt
        rm -rf build_dir/target-*/host
        find build_dir/target-*/packages/ -name "*.o" -o -name "*.o.cmd" 2>/dev/null \
          | xargs rm -f 2>/dev/null || true
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 空间使用情况6
      if: (!cancelled())
      run: df -hT

    - name: 编译固件
      id: compile
      if: steps.cpackage.outputs.status == 'success' && !cancelled()
      run: |
        cd openwrt
        echo -e "$(($(nproc)+1)) thread compile"
        make target/install -j$(nproc) || make target/install -j1 V=s
        make json_overview_image_info
        make checksum
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 空间使用情况7
      if: (!cancelled())
      run: df -hT

    - name: 上传 bin 目录
      uses: actions/upload-artifact@main
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin

    - name: 整理文件
      id: organize
      if: steps.compile.outputs.status == 'success'
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf *.bin
        rm -rf *.buildinfo 
        rm -rf *.json 
        rm -rf *.manifest 
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 固件重命名
      if: steps.organize.outputs.status == 'success'
      shell: bash
      run: |
        cd openwrt/bin/targets/*/*
        for file in *rockchip-armv8-*.gz; do
          new_name=$(echo "$file" | sed 's/rockchip-armv8-//')
          mv -v "$file" "$new_name"
        done

    - name: 上传固件目录
      uses: actions/upload-artifact@main
      if: env.UPLOAD_FIRMWARE == 'true' && steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: 生成发布标签
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        echo -e "🎉 rockchip平台\n✅ 主线源码\n🍃 如出现不稳定可尝试cpu降频\n❗️ ip地址 : 192.168.8.1" >> release.txt
        echo "release_tag=$(date +"%Y.%m.%d_Rockchip")" >> $GITHUB_OUTPUT
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 上传固件到发布
      uses: softprops/action-gh-release@v3.0.2
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*

    - name: 删除以前发布的固件
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # 原用 dev-drprasad/delete-older-releases, 但其上游已停更,
      # 最新 v0.3.4 仍是 Node 20 runtime, 触发 GitHub 弃用警告。
      # 改用 gh CLI 实现 keep_latest:15 + delete_tags 等效逻辑。
      run: |
        # 按 createdAt 升序列出所有 release 的 tag, 跳过最新 15 个, 删除其余(含 tag)
        gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
          --json tagName,createdAt -q 'sort_by(.createdAt) | .[].tagName' \
          | head -n -15 \
          | while read -r tag; do
              [ -n "$tag" ] || continue
              echo "删除 release 及 tag: $tag"
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" \
                --cleanup-tag --yes || true
            done

    - name: 删除以前的工作流程
      uses: Mattraks/delete-workflow-runs@v2
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        repository: ${{ github.repository }}
        retain_days: 1
        keep_minimum_runs: 3
